<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Effemeridi astronomiche: tempo siderale, Luna e Sole calcolati in tempo reale per il tuo luogo.">
<meta name="apple-mobile-web-app-title" content="Effemeridi">
<meta name="theme-color" content="#070507">
<title>Effemeridi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* Layout: una "scheda" color prugna a tutta altezza, tre pagine scorrevoli in orizzontale (Tempo · Luna · Sole), barra con ? · puntini · ingranaggio. Pannello impostazioni chiaro in stile iOS. */
:root{
  --night:#070507;
  --plum:#36263b;
  --plum-deep:#251a29;
  --plum-edge:#4d3a52;
  --ink:#f5eff3;
  --muted:#c4b3c2;
  --faint:rgba(255,255,255,.075);
  --gold:#f1b94a;
  --signal:#6ee06a;
  --sheet:#f2f2f7;
  --cell:#ffffff;
  --sheet-ink:#111114;
  --sheet-muted:#86868c;
  --sheet-line:#d8d8dd;
  --ios-blue:#3168d6;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:460px;margin:0 auto;padding-block:16px 8px;display:flex}
.card{position:relative;flex:1;display:flex;flex-direction:column;min-width:0;border-radius:24px;overflow:hidden;
  background:
    linear-gradient(180deg,#c9c3cb 0,#a39ba6 14px,#857c88 30px,#6a606d 44px,#54485a 49px,rgba(0,0,0,0) 50px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.13) 0 1px,rgba(255,255,255,.03) 1px 2px,rgba(0,0,0,0) 2px 3px),
    linear-gradient(180deg,#3b2c40 0%,#33263a 45%,#2b2030 100%);
  border:3px solid #7d7580;box-shadow:0 0 0 1px #000,inset 0 0 0 1px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35)}
.signal{position:absolute;top:2px;right:8px;width:40px;height:46px;z-index:3}
.signal .on{display:inline}.signal.off .on{display:none}

.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative;z-index:1}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;scroll-snap-align:start;overflow-y:auto;padding:8px 18px 4px 22px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}

.head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;min-height:128px}
.head > div{padding-right:6px;min-width:0}
.title{overflow:hidden;margin-right:34px !important;font-family:var(--display);font-weight:400;font-size:clamp(32px,11vw,46px);letter-spacing:-.5px;line-height:1.2;padding-bottom:2px;margin:6px 0 4px;white-space:nowrap;text-shadow:0 2px 3px rgba(0,0,0,.55)}
#p-sun .title{margin-top:16px}
#sDist{font-size:15px;letter-spacing:-.2px}
.kv{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:3px;font-size:15.5px}
.kv dt{color:var(--ink);white-space:nowrap} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.cal{width:118px;border-radius:22px;position:relative;margin-top:14px;box-shadow:0 8px 16px rgba(0,0,0,.55)}
.cal .top{border-radius:22px 22px 0 0;background:linear-gradient(#e0574a,#b7311f 70%,#9d2316);color:#fff;font-size:14px;white-space:nowrap;padding:14px 8px 7px 11px;display:flex;justify-content:space-between;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.cal .top span:last-child{flex:0 0 auto;width:24px;height:15px;background:radial-gradient(circle,#fff 1.1px,transparent 1.5px) 0 0/4px 4px;opacity:.85}
.cal .day{border-radius:0 0 22px 22px;background:linear-gradient(#fdfdfd,#ececec 55%,#cfcfcf);color:#2f2f2f;font:700 82px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-3px;text-align:center;padding:6px 0 10px;text-shadow:0 1px 0 #fff}
.cal::before,.cal::after{content:"";position:absolute;top:-12px;width:8px;height:26px;border-radius:4px;background:linear-gradient(90deg,#8d8d8d,#fafafa 45%,#a5a5a5);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.cal::before{left:24px}.cal::after{right:24px}

.rows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:10px;row-gap:5px;font-size:18px;align-items:baseline}
.rows dt{color:var(--ink);white-space:nowrap}
.rows dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-sun .rows{grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);font-size:16px}
#p-moon .rows{font-size:17px;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
#p-moon .pair{font-size:14px}
.rows .gap{grid-column:1/-1;height:8px}
.rows dd small{color:var(--muted);font-size:14px}
.pair{display:grid;grid-template-columns:auto 1fr;column-gap:6px;font-size:15.5px;row-gap:2px}
.pair span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.strip{margin-top:auto;display:grid;margin-inline:-22px -18px;border-top:1px solid rgba(255,255,255,.06);box-shadow:0 -1px 0 rgba(0,0,0,.35)}
.strip.three{grid-template-columns:repeat(3,1fr)}
.strip.four{grid-template-columns:repeat(4,1fr)}
.strip > div{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px 2px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;min-width:0;white-space:nowrap}
.strip.three > div{font-size:19px}
.strip > div + div{border-left:1px solid rgba(255,255,255,.05);box-shadow:-1px 0 0 rgba(0,0,0,.3)}
.strip .lbl{font-size:19px;margin-bottom:2px}
.strip canvas{width:56px;height:56px;margin-bottom:6px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.strip.three canvas{width:74px;height:74px;margin-bottom:2px;filter:none}

.moonbig{width:110px;height:110px;margin-top:4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.75))}
.sunbig{width:122px;height:122px;margin-top:2px}

.bar{position:relative;z-index:2;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:2px 12px 6px}
.bar button{width:44px;height:44px;display:grid;place-items:center;font:700 34px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;text-shadow:0 2px 2px rgba(0,0,0,.5)}
.dots{display:flex;justify-content:center;gap:12px}
.dots button{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.3);padding:0}
.dots button[aria-current="true"]{background:#fff}
.gear svg{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

/* ---------- Pannello impostazioni (chiaro, stile iOS) ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--sheet);color:var(--sheet-ink);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
.sheet header{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;min-height:54px;background:#f9f9fb;border-bottom:1px solid var(--sheet-line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet header h2{margin:0;text-align:center;font-size:18px;font-weight:600}
.sheet header button{color:var(--ios-blue);font-size:18px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.sheet main{flex:1;overflow-y:auto;padding:8px 0 24px}
.sec{margin:22px 0 6px;padding-left:max(16px,env(safe-area-inset-left,0px));font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--sheet-muted)}
.group{background:var(--cell);border-block:1px solid var(--sheet-line)}
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:17px}
.cell + .cell{border-top:1px solid var(--sheet-line);margin-left:16px;padding-left:0}
.cell label{font-weight:600;flex:0 0 auto}
.cell .v{color:var(--sheet-muted);text-align:right;min-width:0;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cell select,.cell input{font:inherit;color:var(--sheet-muted);background:transparent;border:0;text-align:right;text-align-last:right;min-width:0;max-width:62vw;appearance:none;-webkit-appearance:none;padding:6px 0}
.cell input[type=number]{width:9.5em}
.cell input:disabled{opacity:.55}
.cell .chev{color:#c4c4c8;font-size:20px}
.note{padding:8px max(16px,env(safe-area-inset-left,0px));font-size:13px;color:var(--sheet-muted);line-height:1.4}
.btn{display:block;width:100%;text-align:left;color:var(--ios-blue);font-weight:500}
.check{color:var(--ios-blue);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#f6f6f8;border-top:1px solid var(--sheet-line);padding:4px 4px 2px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;color:#8e8e93;font-size:12px;border-radius:10px}
.tabs button[aria-selected="true"]{color:var(--ios-blue);background:#dde7fb}
.tabs svg{width:30px;height:30px}
.about{background:#000;color:#cfcfcf;min-height:100%;padding:36px max(20px,env(safe-area-inset-left,0px)) 30px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;line-height:1.5}
.about canvas{width:170px;height:170px}
.about p{margin:0;max-width:34em}
.about .ver{color:#9a9a9a;font-size:14px}

/* ---------- Guida ---------- */
.help{position:fixed;inset:0;z-index:20;background:#fff;color:#1b1b1f;display:flex;flex-direction:column;color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
.help header{min-height:54px;display:flex;align-items:center;border-bottom:1px solid var(--sheet-line);padding-left:max(16px,env(safe-area-inset-left,0px))}
.help header button{color:var(--ios-blue);font-size:18px;text-decoration:underline;text-underline-offset:3px}
.help article{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-left,0px)) 40px max(18px,env(safe-area-inset-right,0px));line-height:1.5;font-size:15px}
.help h3{font-family:var(--display);font-weight:500;font-size:22px;margin:22px 0 6px}
.help dt{font-weight:700;margin-top:10px}
.help dd{margin:2px 0 0}
.help p{max-width:40em}
@media (prefers-reduced-motion:reduce){.pager{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="signal" id="signal" title=""><svg viewBox="0 0 40 46" width="40" height="46" aria-hidden="true">
      <defs><radialGradient id="bulbOn" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#eaffe6"/><stop offset=".45" stop-color="#6ee06a"/><stop offset="1" stop-color="#1c7419"/></radialGradient>
      <radialGradient id="bulbOff" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#f2f2f2"/><stop offset=".5" stop-color="#9a919c"/><stop offset="1" stop-color="#4a404c"/></radialGradient>
      <linearGradient id="pole" x1="0" x2="1"><stop offset="0" stop-color="#8a8a8a"/><stop offset=".45" stop-color="#f4f4f4"/><stop offset="1" stop-color="#7a7a7a"/></linearGradient></defs>
      <g class="on" fill="none" stroke="#52d84e" stroke-width="1.6" stroke-linecap="round" opacity=".9"><path d="M13.5 6.5a7 7 0 0 0 0 9"/><path d="M10 4a11 11 0 0 0 0 14"/><path d="M26.5 6.5a7 7 0 0 1 0 9"/><path d="M30 4a11 11 0 0 1 0 14"/></g>
      <rect x="18.6" y="15" width="2.8" height="24" rx="1.2" fill="url(#pole)"/>
      <ellipse cx="20" cy="40" rx="7" ry="2.2" fill="url(#pole)"/>
      <circle cx="20" cy="11" r="5.2" fill="url(#bulbOff)"/><circle class="on" cx="20" cy="11" r="5.2" fill="url(#bulbOn)"/>
    </svg></div>
    <div class="pager" id="pager">
      <!-- Pagina 1: Tempo -->
      <section class="page" id="p-time" aria-label="Tempo">
        <div class="head">
          <div class="cal" aria-hidden="true"><div class="top"><span id="calMonth">nov 2026</span><span></span></div><div class="day" id="calDay">6</div></div>
          <div style="min-width:0">
            <h1 class="title" id="placeName">Bologna</h1>
            <dl class="kv">
              <dt data-t="lat"></dt><dd id="vLat"></dd>
              <dt data-t="lon"></dt><dd id="vLon"></dd>
              <dt data-t="alt"></dt><dd id="vAlt"></dd>
            </dl>
          </div>
        </div>
        <dl class="rows">
          <dt data-t="date"></dt><dd id="vDate"></dd>
          <dt data-t="time"></dt><dd id="vTime"></dd>
          <div class="gap"></div>
          <dt data-t="tz"></dt><dd id="vTz"></dd>
          <dt data-t="sid"></dt><dd id="vSid"></dd>
          <dt data-t="gsid"></dt><dd id="vGsid"></dd>
          <dt data-t="jd"></dt><dd id="vJd"></dd>
          <div class="gap"></div>
          <dt data-t="dateUtc"></dt><dd id="vDateU"></dd>
          <dt data-t="timeUtc"></dt><dd id="vTimeU"></dd>
          <dt>Delta-T:</dt><dd id="vDT"></dd>
        </dl>
        <div class="strip three">
          <div><span class="lbl" data-t="rise"></span><canvas id="icRise" width="200" height="200"></canvas><span id="vRise"></span></div>
          <div><span class="lbl" data-t="transit"></span><canvas id="icTransit" width="200" height="200"></canvas><span id="vTransit"></span></div>
          <div><span class="lbl" data-t="set"></span><canvas id="icSet" width="200" height="200"></canvas><span id="vSet"></span></div>
        </div>
      </section>

      <!-- Pagina 2: Luna -->
      <section class="page" id="p-moon" aria-label="Luna">
        <div class="head">
          <canvas class="moonbig" id="moonBig" width="360" height="360"></canvas>
          <div style="min-width:0">
            <h1 class="title" id="moonName"></h1>
            <dl class="kv">
              <dt data-t="ra"></dt><dd id="mRa"></dd>
              <dt data-t="dec"></dt><dd id="mDec"></dd>
              <dt data-t="lunation"></dt><dd id="mLun"></dd>
            </dl>
          </div>
        </div>
        <dl class="rows">
          <dt data-t="mrise"></dt><dd id="mRise"></dd>
          <dt data-t="mset"></dt><dd id="mSet"></dd>
          <div class="gap"></div>
          <dt data-t="hour"></dt><dd id="mHA"></dd>
          <dt data-t="altaz"></dt><dd><div class="pair"><span data-t="altitude"></span><span id="mAlt"></span><span data-t="azimuth"></span><span id="mAz"></span></div></dd>
          <div class="gap"></div>
          <dt data-t="age"></dt><dd id="mAge"></dd>
          <dt data-t="phase"></dt><dd id="mPhase"></dd>
          <dt data-t="visible"></dt><dd id="mVis"></dd>
          <dt data-t="dist"></dt><dd id="mDist"></dd>
          <div class="gap"></div>
          <dt data-t="ecl"></dt><dd><div class="pair"><span data-t="elat"></span><span id="mEb"></span><span data-t="elon"></span><span id="mEl"></span></div></dd>
        </dl>
        <div class="strip four" id="phaseStrip"></div>
      </section>

      <!-- Pagina 3: Sole -->
      <section class="page" id="p-sun" aria-label="Sole">
        <div class="head">
          <canvas class="sunbig" id="sunBig" width="360" height="360"></canvas>
          <div style="min-width:0">
            <h1 class="title" data-t="sun"></h1>
            <dl class="kv">
              <dt data-t="ra"></dt><dd id="sRa"></dd>
              <dt data-t="dec"></dt><dd id="sDec"></dd>
            </dl>
          </div>
        </div>
        <dl class="rows">
          <dt data-t="daylen"></dt><dd id="sLen"></dd>
          <div class="gap"></div>
          <dt data-t="dawn"></dt><dd id="sDawn"></dd>
          <dt data-t="srise"></dt><dd id="sRise"></dd>
          <dt data-t="maxalt"></dt><dd id="sMax"></dd>
          <dt data-t="sset"></dt><dd id="sSet"></dd>
          <dt data-t="dusk"></dt><dd id="sDusk"></dd>
          <div class="gap"></div>
          <dt data-t="dist"></dt><dd id="sDist"></dd>
          <dt data-t="diam"></dt><dd id="sDiam"></dd>
          <dt data-t="slon"></dt><dd id="sLon"></dd>
          <div class="gap"></div>
          <dt data-t="eot"></dt><dd id="sEot"></dd>
          <dt data-t="obl"></dt><dd id="sObl"></dd>
          <div class="gap"></div>
          <dt data-t="nut"></dt><dd><div class="pair"><span>(Δψ)</span><span id="sDpsi"></span><span>(Δε)</span><span id="sDeps"></span></div></dd>
        </dl>
      </section>
    </div>
    <div class="bar">
      <button id="btnHelp" aria-label="Guida">?</button>
      <div class="dots" id="dots"><button aria-label="Tempo" aria-current="true"></button><button aria-label="Luna"></button><button aria-label="Sole"></button></div>
      <button class="gear" id="btnGear" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
    </div>
  </div>
</div>

<!-- Impostazioni -->
<div class="sheet" id="sheet" hidden>
  <header><button id="sheetDone" data-t="done"></button><h2 id="sheetTitle"></h2><span></span></header>
  <main id="sheetBody"></main>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="settings" aria-selected="true"><svg viewBox="0 0 32 32" fill="currentColor"><rect x="6" y="4" width="4" height="12" rx="1"/><rect x="5" y="17" width="6" height="11" rx="2"/><path d="M19 4h3v6h2V4h3v7l-3 3v12a2 2 0 0 1-4 0V14l-3-3V4z"/></svg><span data-t="tabSettings"></span></button>
    <button role="tab" data-tab="location"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3"><circle cx="16" cy="16" r="12"/><ellipse cx="16" cy="16" rx="5.5" ry="12"/><path d="M4 16h24M6 9.5h20M6 22.5h20"/></svg><span data-t="tabLocation"></span></button>
    <button role="tab" data-tab="language"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M5 5h13v10H11l-4 3v-3H5z"/><path d="M20 12h7v10h-2v3l-4-3h-6v-5h5z" opacity=".7"/></svg><span data-t="tabLanguage"></span></button>
    <button role="tab" data-tab="about"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M7 20l14-14 3 3-14 14z"/><path d="M14 20l-5 9h2.5l4-7 4 7H22l-5-9z"/><circle cx="25" cy="4" r="1"/><circle cx="28" cy="8" r="1"/><circle cx="21" cy="2.5" r=".8"/></svg><span data-t="tabAbout"></span></button>
  </nav>
</div>

<!-- Guida -->
<div class="help" id="help" hidden>
  <header><button id="helpDone" data-t="done"></button></header>
  <article id="helpBody"></article>
</div>

<script>
/* =====================================================================
   ASTRONOMIA — algoritmi da J. Meeus, "Astronomical Algorithms" (2ª ed.)
   ===================================================================== */
const Astro = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const n360 = x => ((x % 360) + 360) % 360;
  const sin = d => Math.sin(d * D2R), cos = d => Math.cos(d * D2R);
  const SYN = 29.530588853;

  const jdFromMs = ms => ms / 86400000 + 2440587.5;
  const msFromJd = jd => (jd - 2440587.5) * 86400000;

  // Delta-T (secondi) — polinomi di Espenak & Meeus
  function deltaT(jd) {
    const y = 2000 + (jd - 2451544.5) / 365.25;
    let t;
    if (y >= 2005 && y < 2050) { t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
    if (y >= 2050 && y < 2150) return -20 + 32 * ((y - 1820) / 100) ** 2 - 0.5628 * (2150 - y);
    if (y >= 1986 && y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }

    ctx.beginPath(); ctx.arc(0, 0, rad * 1.004, 0, Math.PI * 2); ctx.stroke();
    const ac = 0.18, span = 0.55;
    for (let k = 0; k < 190; k++) {                                        // filamenti della protuberanza
      const t = pr(), a = ac + (t - 0.5) * span, env = Math.pow(Math.sin(Math.PI * t), 0.8);
      const h = rad * (0.03 + 0.26 * env * (0.5 + 0.65 * pr()));
      const bend = (0.5 - t) * 0.34 + (pr() - 0.5) * 0.14;                 // le fibre si piegano verso il centro: forma ad arco
      const r0 = rad * 0.97, r1 = rad + h, ca = a + bend * 0.45, ta = a + bend;
      ctx.strokeStyle = `hsla(${10 + pr() * 24},95%,${46 + pr() * 20}%,${0.14 + pr() * 0.22})`;
      ctx.lineWidth = W * (0.004 + pr() * 0.01);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.quadraticCurveTo(Math.cos(ca) * (r0 + h * 0.75), Math.sin(ca) * (r0 + h * 0.75), Math.cos(ta) * r1, Math.sin(ta) * r1);
      ctx.stroke();
    }
    for (let k = 0; k < 14; k++) {                                         // piccole spicole sparse sul bordo
      const a = pr() * Math.PI * 2, h = rad * (0.02 + pr() * 0.05);
      ctx.strokeStyle = "rgba(230,80,30,.35)"; ctx.lineWidth = W * 0.006;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * rad * 0.98, Math.sin(a) * rad * 0.98); ctx.lineTo(Math.cos(a + 0.03) * (rad + h), Math.sin(a + 0.03) * (rad + h)); ctx.stroke();
    }
    ctx.restore();
    ctx.drawImage(disc, 0, 0);
    return;
  }
  if (mode === "transit") { // sfera gialla lucida con alone
    const c = W / 2, halo = ctx.createRadialGradient(c, c, W * 0.26, c, c, W * 0.5);
    halo.addColorStop(0, "rgba(255,190,60,.75)"); halo.addColorStop(0.35, "rgba(255,160,40,.28)"); halo.addColorStop(1, "rgba(255,140,30,0)");
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, W);
    const ball = ctx.createRadialGradient(c - W * 0.09, c - W * 0.11, W * 0.02, c, c, W * 0.33);
    ball.addColorStop(0, "#fffbd6"); ball.addColorStop(0.35, "#ffe36a"); ball.addColorStop(0.8, "#f6bb22"); ball.addColorStop(1, "#e19a10");
    ctx.fillStyle = ball; ctx.beginPath(); ctx.arc(c, c, W * 0.32, 0, Math.PI * 2); ctx.fill();
    return;
  }

    const m = document.createElement("canvas"); m.width = m.height = Math.round(W * 0.6); drawMoon(m, 1, true, false);
    ctx.drawImage(m, W * 0.21, W * 0.14);
    const blobs = [[0.18, 0.60, 0.15, 0.07, 0.85], [0.33, 0.70, 0.20, 0.08, 0.8], [0.52, 0.76, 0.22, 0.06, 0.7], [0.72, 0.68, 0.21, 0.08, 0.75],
      [0.88, 0.60, 0.11, 0.05, 0.6], [0.08, 0.52, 0.08, 0.035, 0.55], [0.62, 0.62, 0.12, 0.05, 0.5], [0.80, 0.45, 0.07, 0.03, 0.35]];
    for (const [x, y, rx, ry, a] of blobs) {
      ctx.save(); ctx.translate(x * W, y * W); ctx.scale(rx * W, ry * W);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      g.addColorStop(0, `rgba(238,238,242,${a})`); g.addColorStop(0.55, `rgba(220,220,228,${a * 0.55})`); g.addColorStop(1, "rgba(210,210,220,0)");
      ctx.fillStyle = g; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
    }
    return;
  }
  // "rise": Sole che sorge dal mare, con i riflessi
  const img = ctx.createImageData(W, W), rad = 0.62, cy = 0.04;
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const u = (x + 0.5) / W * 2 - 1, v = (y + 0.5) / W * 2 - 1, i4 = (y * W + x) * 4;
    const d = Math.hypot(u, v - cy) / rad;
    const n = SUN_NOISE[(Math.min(199, ((v + 1) / 2 * 200) | 0)) * 200 + Math.min(199, ((u + 1) / 2 * 200) | 0)];
    let r = 0, g = 0, b = 0, a = 0;
    if (d <= 1.15) {
      const limb = d <= 1 ? 0.75 + 0.25 * Math.sqrt(1 - d * d) : 0.75;
      r = 250 * limb; g = (175 + 50 * n + (1 - v) * 18) * limb; b = (70 + 40 * n) * limb;
      a = 255 * smooth(1.15, 0.85, d);
    }
    if (v > cy + 0.18) { // orizzonte: bande orizzontali
      const band = Math.sin((v - cy) * 62) > -0.1 ? 1 : 0.25;
      const half = rad * 1.22 - (v - cy - 0.18) * 0.25;
      const fade = smooth(half, half - 0.12, Math.abs(u)) * smooth(0.95, 0.55, v);
      r = 245; g = 205 + 20 * n; b = 90; a = 255 * band * fade;
    }
    img.data[i4] = r; img.data[i4 + 1] = g; img.data[i4 + 2] = b; img.data[i4 + 3] = a;
  }
  ctx.putImageData(img, 0, 0);
}

/* =====================================================================
   CALCOLO E RENDER
   ===================================================================== */
const $ = id => document.getElementById(id);
const set = (id, v) => { const el = $(id); if (el.textContent !== v) el.textContent = v; };
let dayCache = { key: "" };

function dayKey(utMs, off) { const d = localParts(utMs, off); return [d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), S.lat, S.lon, off, S.lang, S.hemi, S.units].join("|"); }

function computeDay(utMs, off) {
  const d = localParts(utMs, off), start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - off * 3600000;
  const sunE = Astro.events("sun", start, S.lat, S.lon, () => -0.8333);
  const civ = Astro.events("sun", start, S.lat, S.lon, () => -6);
  const moonE = Astro.events("moon", start, S.lat, S.lon, p => 0.7275 * p.par - 0.5667);
  return { sunE, civ, moonE, start };
}

function render() {
  const ut = currentUT(), off = offsetAt(ut), jd = Astro.jdFromMs(ut);
  const key = dayKey(ut, off);
  if (dayCache.key !== key) { dayCache = { key, ...computeDay(ut, off) }; renderDaily(off); }

  // --- Tempo
  const d = localParts(ut, off);
  set("calMonth", d.toLocaleDateString(loc(), { month: "short", year: "numeric", timeZone: "UTC" }).replace(/\./g, ""));
  set("calDay", String(d.getUTCDate()));
  set("vDate", fmtDate(ut, off)); set("vTime", fmtTime(ut, off, true));
  set("vTz", fmtOff(off));
  const sn = Astro.sun(jd);
  set("vSid", fmtSid(Astro.gast(jd, sn.nut) + S.lon));
  set("vGsid", fmtSid(Astro.gast(jd, sn.nut)));
  set("vJd", jd.toFixed(6).replace(".", S.lang === "it" ? "," : "."));
  set("vDateU", fmtDate(ut, 0)); set("vTimeU", fmtTime(ut, 0, true));
  set("vDT", `${num(sn.dT, 2)} ${tr("sec")}`);

  // --- Sole
  set("sRa", fmtRA(sn.ra)); set("sDec", fmtDMS(sn.dec));
  set("sDist", km(sn.km)); set("sDiam", `${num(sn.diam, 2)} ${tr("deg")}`); set("sLon", `${num(sn.lam, 2)} ${tr("deg")}`);
  const e = sn.eot, em = Math.floor(Math.abs(e)), es = Math.round((Math.abs(e) - em) * 60);
  set("sEot", `${e < 0 ? "−" : "+"} ${em} ${tr("min")} ${pad(es === 60 ? 0 : es)} ${tr("sec")}`);
  set("sObl", `${num(sn.nut.eps, 4)} ${tr("deg")}`);
  set("sDpsi", `${num(sn.nut.dpsi, 2)}″`); set("sDeps", `${num(sn.nut.deps, 2)}″`);

  // --- Luna
  // posizione e distanza geocentriche (come negli annuari); altezza e azimut visti dal luogo
  const mg = Astro.moon(jd), mn = mg, hz = Astro.horizontal(Astro.topocentric(mg, jd, S.lat, S.lon, S.alt), jd, S.lat, S.lon);
  const topoAlt = hz.alt;
  set("mRa", fmtRA(mn.ra)); set("mDec", fmtDMS(mn.dec));
  const ha = hms(hz.H / 15); set("mHA", `${pad(ha.h)}h ${pad(ha.m)}m`);
  set("mAlt", `${num(topoAlt, 2)} ${tr("deg")}`); set("mAz", `${num(hz.az, 2)} ${tr("deg")}`);
  set("mDist", km(mn.km)); set("mEb", fmtDMS(mn.beta)); set("mEl", fmtDMS(mn.lam, false));

  const ph = Astro.phases(jd), age = jd - ph.lastNew.jd, frac = age / Astro.SYN;
  const ad = Math.floor(age), ah = Math.floor((age - ad) * 24), am = Math.floor(((age - ad) * 24 - ah) * 60);
  set("mAge", `${ad} ${tr("days")} ${ah} ${tr("hours")} ${am} ${tr("min")}`);
  set("mPhase", `${num(frac * 100, 2)} %`);
  const elong = Astro.n360(mg.lam - sn.lam), cosE = Math.cos(mg.beta * Astro.D2R) * Math.cos(elong * Astro.D2R);
  const psi = Math.acos(cosE), i = Math.atan2(sn.km * Math.sin(psi), mg.km - sn.km * cosE), illum = (1 + Math.cos(i)) / 2;
  set("mVis", `${num(illum * 100, 2)} %`);
  set("mLun", String(ph.lunation));
  const idx = frac < 0.0339 || frac >= 0.9661 ? 0 : frac < 0.216 ? 1 : frac < 0.284 ? 2 : frac < 0.466 ? 3 : frac < 0.534 ? 4 : frac < 0.716 ? 5 : frac < 0.784 ? 6 : 7;
  if ($("moonName").textContent !== tr("phases")[idx]) { set("moonName", tr("phases")[idx]); fitTitle($("moonName")); }
  const mk = `${num(illum, 3)}|${elong < 180}|${S.hemi}`;
  if (render.moonKey !== mk) { render.moonKey = mk; drawMoon($("moonBig"), illum, elong < 180, S.hemi === "S"); }

  // fasi successive
  const pk = ph.next.map(p => p.jd.toFixed(4)).join() + off + S.lang + S.hemi;
  if (render.phaseKey !== pk) {
    render.phaseKey = pk;
    const strip = $("phaseStrip"); strip.textContent = "";
    ph.next.forEach(p => {
      const ms = Astro.msFromJd(p.jd), cell = document.createElement("div"), cv = document.createElement("canvas");
      cv.width = cv.height = 140; cell.append(cv);
      const dd = document.createElement("span"); dd.textContent = localParts(ms, offsetAt(ms)).toLocaleDateString(loc(), { day: "numeric", month: "short", timeZone: "UTC" }).replace(/\./g, "");
      const tt = document.createElement("span"); tt.textContent = fmtTime(ms, offsetAt(ms));
      cell.title = tr("phases")[p.type * 2]; cell.append(dd, tt); strip.append(cell);
      drawMoon(cv, [0, 0.5, 1, 0.5][p.type], p.type < 2, S.hemi === "S");
    });
  }
  for (const id of ["placeName", "moonName"]) { const el = $(id); if (el.scrollWidth > el.clientWidth + 1) fitTitle(el); }
  $("signal").classList.toggle("off", !S.realtime);
  $("signal").title = S.realtime ? tr("realtime") + ": " + tr("yes") : tr("realtime") + ": " + tr("no");
}

function fitTitle(el) {
  el.style.fontSize = "";
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && fs > 20) { fs -= 1; el.style.fontSize = fs + "px"; }
}
function renderDaily(off) {
  const { sunE, civ, moonE } = dayCache;
  set("placeName", S.place); fitTitle($("placeName"));
  set("vLat", fmtLatLon(S.lat, true)); set("vLon", fmtLatLon(S.lon, false));
  set("vAlt", S.units === "metric" ? `${num(S.alt, 2)} ${tr("meters")}` : `${num(S.alt * 3.28084, 2)} ${tr("feet")}`);
  const tm = ev => ev ? fmtTime(ev.ms, off) : tr("none");
  set("vRise", tm(sunE.rise)); set("vTransit", tm(sunE.transit)); set("vSet", tm(sunE.set));
  set("sRise", tm(sunE.rise)); set("sSet", tm(sunE.set)); set("sDawn", tm(civ.rise)); set("sDusk", tm(civ.set));
  set("sMax", sunE.transit ? `${fmtTime(sunE.transit.ms, off)}  (${num(sunE.transit.alt, 2)}°)` : tr("none"));
  if (sunE.rise && sunE.set) {
    let len = (sunE.set.ms - sunE.rise.ms) / 60000; if (len < 0) len += 1440;
    set("sLen", `${Math.floor(len / 60)} ${tr("hours")} ${Math.round(len % 60)} ${tr("min")}`);
  } else {
    const above = sunE.transit && sunE.transit.alt > 0;
    set("sLen", above ? "24 " + tr("hours") : "0 " + tr("hours"));
  }
  const mt = (ev, miss) => ev ? `${fmtTime(ev.ms, off, false, true)} ${tr("azimuth")} ${num(ev.az, 2)}°` : tr(miss);
  set("mRise", mt(moonE.rise, "noRise")); set("mSet", mt(moonE.set, "noSet"));
  // ordina levata/tramonto per ora, come nell'originale
  const rows = $("p-moon").querySelector(".rows"), rdt = rows.children[0], rdd = rows.children[1], sdt = rows.children[2], sdd = rows.children[3];
  const setFirst = moonE.set && (!moonE.rise || moonE.set.ms < moonE.rise.ms);
  if (setFirst && rdt.dataset.t === "mrise") { rows.insertBefore(sdt, rdt); rows.insertBefore(sdd, rdt); }
  if (!setFirst && rdt.dataset.t === "mset") { rows.insertBefore(sdt, rdt); rows.insertBefore(sdd, rdt); }
}

function applyTexts() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = tr(el.dataset.t); });
  $("helpBody").innerHTML = T[S.lang].help || T.it.help;
  if (S.lang === "en") $("helpBody").innerHTML = `<p>Explanations are written in Italian; switch the language in Settings › Language.</p>` + T.it.help;
}

const pager = $("pager"), dots = [...$("dots").children];
pager.addEventListener("scroll", () => {
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  dots.forEach((b, j) => b.setAttribute("aria-current", String(i === j)));
  try { localStorage.setItem("effemeridi.page", String(i)); } catch (e) {}
}, { passive: true });
dots.forEach((b, j) => b.addEventListener("click", () => pager.scrollTo({ left: j * pager.clientWidth, behavior: "smooth" })));
document.addEventListener("keydown", e => {
  if (!$("sheet").hidden || !$("help").hidden) { if (e.key === "Escape") { closeSheet(); $("help").hidden = true; } return; }
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  if (e.key === "ArrowRight") pager.scrollTo({ left: Math.min(2, i + 1) * pager.clientWidth, behavior: "smooth" });
  if (e.key === "ArrowLeft") pager.scrollTo({ left: Math.max(0, i - 1) * pager.clientWidth, behavior: "smooth" });
});
$("btnHelp").onclick = () => { $("help").hidden = false; };
$("helpDone").onclick = () => { $("help").hidden = true; };

$("btnGear").onclick = () => { $("sheet").hidden = false; renderSheet(); };
$("sheetDone").onclick = closeSheet;
function closeSheet() { $("sheet").hidden = true; save(); dayCache.key = ""; render.moonKey = render.phaseKey = ""; render(); }
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderSheet(); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const chev = `<span class="chev" aria-hidden="true">›</span>`;

  const titles = { settings: "tabSettings", location: "tabLocation", language: "tabLanguage", about: "tabAbout" };

      <div class="cell"><label for="fDate">${tr("fDate")}</label><span class="v"><input type="date" id="fDate" value="${S.date}" ${S.realtime ? "disabled" : ""}></span></div>

      <div class="sec">${tr("sCoords")}</div><div class="group">

  } else {

function bindSheet() {
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on("fHemi", "change", e => { S.hemi = e.target.value; save(); });
  on("fUnits", "change", e => { S.units = e.target.value; save(); renderSheet(); });
  on("fClock", "change", e => { S.clock = e.target.value; save(); });
  on("fRt", "change", e => { S.realtime = e.target.value === "1"; save(); renderSheet(); });
  on("fDate", "change", e => { if (e.target.value) S.date = e.target.value; save(); });
  on("fTime", "change", e => { if (e.target.value) S.time = e.target.value.length === 5 ? e.target.value + ":00" : e.target.value; save(); });
  on("fCountry", "change", e => { S.country = e.target.value; const c = CITIES.find(c => c[1] === S.country); if (c) pickCity(c); renderSheet(); });
  on("fCity", "change", e => { const c = CITIES.find(c => c[0] === e.target.value && c[1] === S.country); if (c) pickCity(c); renderSheet(); });
  const custom = () => { if (!S.gps) S.place = tr("custom"); };
  on("fLat", "change", e => { const v = parseFloat(e.target.value); if (isFinite(v) && Math.abs(v) <= 90) { S.lat = v; custom(); save(); renderSheet(); } });
  on("fLon", "change", e => { const v = parseFloat(e.target.value); if (isFinite(v) && Math.abs(v) <= 180) { S.lon = v; custom(); save(); renderSheet(); } });
  on("fAltm", "change", e => { const v = parseFloat(e.target.value); if (isFinite(v)) { S.alt = S.units === "metric" ? v : v / 3.28084; save(); } });
  on("fTz", "change", e => { if (e.target.value === "") return; S.tz = parseFloat(e.target.value); if (S.rule === "SYS") S.rule = "EU"; save(); });
  on("fDst", "change", e => { S.dst = e.target.value; save(); });
  on("fGps", "click", useGps);
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { S.lang = b.dataset.lang; save(); applyTexts(); renderSheet(); });
}
function pickCity(c) {
  [S.place, S.country, S.lat, S.lon, S.alt, S.tz, S.rule] = c; S.gps = false; S.dst = "auto"; gpsMsg = ""; save();
}
function useGps() {
  if (!navigator.geolocation) { gpsMsg = tr("gpsFail"); renderSheet(); return; }
  gpsMsg = tr("gpsWait"); renderSheet();
  navigator.geolocation.getCurrentPosition(p => {
    S.gps = true; S.lat = +p.coords.latitude.toFixed(4); S.lon = +p.coords.longitude.toFixed(4);
    S.alt = p.coords.altitude ? Math.round(p.coords.altitude) : 0; S.place = tr("gpsPlace"); S.country = "";
    S.rule = "SYS"; S.dst = "auto"; gpsMsg = ""; save(); renderSheet();
  }, () => { gpsMsg = tr("gpsFail"); renderSheet(); }, { timeout: 10000, maximumAge: 600000 });
}

/* =====================================================================
   AVVIO
   ===================================================================== */
applyTexts();
drawSun($("sunBig"), "big"); drawSun($("icRise"), "rise"); drawSun($("icTransit"), "transit"); drawSun($("icSet"), "set");
render();
try { const pg = +localStorage.getItem("effemeridi.page"); if (pg > 0) requestAnimationFrame(() => { pager.scrollLeft = pg * pager.clientWidth; }); } catch (e) {}
addEventListener("resize", () => { fitTitle($("placeName")); fitTitle($("moonName")); });
setInterval(() => { if (S.realtime || render.first !== true) { render(); render.first = true; } }, 1000);
</script>
</body>
